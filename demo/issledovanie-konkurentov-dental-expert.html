<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Оригинальное интерактивное исследование конкурентов Dental Expert, перенесённое из скачанного HTML-артефакта Claude.">
<title>Кто на поле техосмотра — Dental Expert</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0f1419;color:#e5edf8;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
#state{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.6}
#artifact{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#0f1419}
</style>
</head>
<body>
<div id="state">Загружаю оригинальное интерактивное исследование…</div>
<iframe id="artifact" title="Оригинальный артефакт Claude: Кто на поле техосмотра" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
<script>
(async()=>{
 const files=["./artifact-source/part-01.txt","./artifact-source/part-02.txt","./artifact-source/part-03.txt","./artifact-source/part-04.txt","./artifact-source/part-05.txt","./artifact-source/part-06a.txt","./artifact-source/part-06b.txt","./artifact-source/part-06c.txt","./artifact-source/part-06d.txt","./artifact-source/part-06e.txt"];
 const state=document.getElementById("state");
 try{
   const chunks=await Promise.all(files.map(async url=>{
     const response=await fetch(url,{cache:"no-store"});
     if(!response.ok) throw new Error("Не удалось загрузить часть исходного HTML: "+url+" ("+response.status+")");
     return (await response.text()).trim();
   }));
   const base64=chunks.join("");
   const binary=atob(base64);
   const bytes=new Uint8Array(binary.length);
   for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
   if(!("DecompressionStream" in window)) throw new Error("Браузер не поддерживает безопасную распаковку gzip. Откройте страницу в актуальной версии Chrome, Edge, Safari или Firefox.");
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
   const html=await new Response(stream).text();
   if(!html.startsWith("<!doctype html>") || !html.includes("Кто на поле техосмотра")) throw new Error("Проверка оригинального HTML не прошла.");
   // Super Dark Apache: pin the original artifact to the same dark palette as the main portfolio.
   // The source HTML and all research content remain unchanged in storage; only theme selection is forced at render time.
   const themedHtml=html
     .replace("<!doctype html><html>", "<!doctype html><html data-theme=\"dark\">")
     .replace(":root{color-scheme:light}", ":root{color-scheme:dark}");
   if(!themedHtml.includes('<html data-theme="dark">') || !themedHtml.includes(":root{color-scheme:dark}")) throw new Error("Не удалось закрепить тему Super Dark Apache.");
   document.getElementById("artifact").srcdoc=themedHtml;
   document.getElementById("artifact").style.display="block";
   state.remove();
 }catch(error){
   state.textContent="Не удалось загрузить оригинальное исследование. "+(error&&error.message?error.message:"Попробуйте обновить страницу.");
   state.style.color="#fca5a5";
 }
})();
</script>
</body>
</html>
