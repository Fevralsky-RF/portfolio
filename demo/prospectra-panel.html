    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .nav-item:hover { background: ${x.bgT} !important; color: ${x.gray} !important; }
    .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Cascadia Code', monospace; }
    .custom-tooltip {

    .source-chip { transition: all 0.1s; }
    .source-chip:hover { border-color: ${x.green} !important; color: ${x.green} !important; }
    .tab-active { border-bottom: 2px solid ${x.green} !important; color: ${x.green} !important; }
    .stage-col { transition: background 0.15s; }
